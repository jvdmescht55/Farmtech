name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel:
    name: Laravel (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, curl, fileinfo, zip, gd
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # phpunit.xml already points at SQLite in-memory for the whole
      # testing environment (see phpunit.xml) — no separate migrate step
      # against a real database is needed; RefreshDatabase inside the
      # test suite itself handles migrating fresh per test.
      - name: Run Laravel test suite
        run: php artisan test

  worker:
    name: Worker (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run worker test suite
        run: npm test
